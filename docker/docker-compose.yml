services:
  dev:
    build:
      context: ..
      dockerfile: docker/dev.dockerfile
    volumes:
      - ..:/project
      - $SSH_AUTH_SOCK:/ssh-agent
    ports:
      - "8888:8888"
      - "5000:5000"
    environment:
      - PYTHONPATH=/project
      - SSH_AUTH_SOCK=/ssh-agent
      - MLFLOW_TRACKING_URI=http://localhost:5000
    command: >
      bash -c "python -m mlflow server
        --port 5000
        --host 0.0.0.0
        --backend-store-uri /project/mlflow/runs
        --default-artifact-root /project/mlflow/artifacts
        &
        sleep infinity"