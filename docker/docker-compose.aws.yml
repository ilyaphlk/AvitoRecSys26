services:
  dev:
    # Pass EC2 IAM credentials through to the container
    # (The container can reach the metadata endpoint automatically)
    network_mode: "host"   # Important: lets container reach 169.254.169.254 (IAM metadata)
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    command: >
      bash -c "python -m mlflow server
        --port 5000
        --host 0.0.0.0
        --backend-store-uri s3://${S3_BUCKET}/mlflow/runs
        --default-artifact-root s3://${S3_BUCKET}/mlflow/artifacts
        &
        sleep infinity"