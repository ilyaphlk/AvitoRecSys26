constants:
  CONTACT_EIDS: [0, 2, 4, 5, 6, 8, 9, 11, 14, 15, 16]


aggregate_partitions:
  mlflow_log_artifacts: False
  in_artifacts:
    filename_in: dev/processed/raw_filter_dt/
    do_merge: True
  out_artifacts:
    filename_out: dev/processed/local_shows_clicks_do_partition/
    partition_args:
      - {part: df, args: {key: user_id}}
      - {part: [user_id], args: {key: user_id}}
      - {part: [item_id, user_id], args: {key: user_id}}
      - {part: [item_id], args: {key: item_id}}
  kwargs:
    cfg:
      eager_execution: False
      join_back: False
      features:
        aggregations:
        - group_by: [user_id]
          agg:
            - {alias: events_cnt_by_user_id, col: eid, func: count}
            - {alias: clicks_cnt_by_user_id, col: eid, func: count_if, condition: {is_in: $CONTACT_EIDS}}  # count_if
        - group_by: [item_id, user_id]
          agg:
            - {alias: events_cnt_by_item_id_user_id, col: eid, func: count}
            - {alias: clicks_cnt_by_item_id_user_id, col: eid, func: count_if, condition: {is_in: $CONTACT_EIDS}}  # count_if
        - group_by: [item_id]
          agg:
            - {alias: events_cnt_by_item_id, col: eid, func: count}
            - {alias: clicks_cnt_by_item_id, col: eid, func: count_if, condition: {is_in: $CONTACT_EIDS}}  # count_if


make_item_id_blacklist:
  mlflow_log_artifacts: False
  in_artifacts:
    filename_in: dev/processed/local_shows_clicks_do_partition/item_id/part_*.parquet
    do_merge: True
  out_artifacts:
    filename_out: dev/processed/local_shows_clicks_do_partition/item_blacklist_shows_$$MIN_EVENTS_ITEM_ID$$_clicks_$$MIN_CLICKS_ITEM_ID$$.parquet
  kwargs:
    cfg:
      join_back: False
      overwrite_df_in: True  # works only if there is exactly one aggregation key set
      features:
        aggregations:
        - group_by: ["item_id"]
          agg:
            - {alias: events_cnt_by_item_id, col: events_cnt_by_item_id, func: sum}
            - {alias: clicks_cnt_by_item_id, col: clicks_cnt_by_item_id, func: sum}
      filters:
        events_cnt_by_item_id: {"<": $MIN_EVENTS_ITEM_ID}
        clicks_cnt_by_item_id: {"<": $MIN_CLICKS_ITEM_ID}


make_user_id_blacklist:
  mlflow_log_artifacts: False
  in_artifacts:
    filename_in: dev/processed/local_shows_clicks_do_partition/user_id/part_*.parquet
    do_merge: True
  out_artifacts:
    filename_out: dev/processed/local_shows_clicks_do_partition/user_blacklist_shows_$$MIN_SHOWS_USER_ID$$_clicks_$$MIN_CLICKS_USER_ID$$.parquet
  kwargs:
    cfg:
      join_back: False
      filters:
        events_cnt_by_user_id: {"<": $MIN_EVENTS_USER_ID}
        clicks_cnt_by_user_id: {"<": $MIN_CLICKS_USER_ID}


filter_by_blacklists:
  mlflow_log_artifacts: False
  in_artifacts:
    filename_in: dev/processed/local_shows_clicks_do_partition/item_id_user_id/
    do_merge: True
    join_tables:
    - join_key: item_id
      name: dev/processed/local_shows_clicks_do_partition/item_blacklist_shows_$$MIN_EVENTS_ITEM_ID$$_clicks_$$MIN_CLICKS_ITEM_ID$$.parquet
      join_type: anti
    - join_key: user_id
      name: dev/processed/local_shows_clicks_do_partition/user_blacklist_shows_$$MIN_EVENTS_USER_ID$$_clicks_$$MIN_CLICKS_USER_ID$$.parquet
      join_type: anti
  out_artifacts:
    filename_out: processed/local_shows_clicks_do_partition/item_id_user_id/whitelisted/by_min_limits/
    partition_args:
      - {part: df, key: user_id}
  kwargs:
    eager_execution: False
